# ===========================================================
#  E-Voting Terminal - Configuration
# ===========================================================
#  A copy of this file placed next to the jar takes precedence
#  over the packaged one, so a deployed terminal can be
#  reconfigured without rebuilding.
#
#  Shipped defaults below match E-voting_Server's "dev" Spring
#  profile (application-dev.properties) — SSL off, and the
#  provisioning secret matching the server's dev bootstrap
#  secret and the PI-WARD-01 row seeded by V6__dev_test_terminal.sql.
#  Change every value in this section before a real deployment.
# ===========================================================

# ---- Server ----------------------------------------------
# Must be https outside development. Ballots are not sent over
# plain HTTP once ALLOW_INSECURE_TRANSPORT is back to false.
SERVER_URL=http://localhost:8443

# ---- Terminal identity -----------------------------------
# MACHINE_ID must match a terminal registered in the admin
# dashboard. Terminals are added there, not here.
MACHINE_ID=PI-WARD-01

# One-time secret shown by the admin dashboard when this
# terminal was provisioned. Paste it here, then it is only
# ever sent over TLS and never stored by the server in the
# clear. Re-provisioning the terminal invalidates the old one.
# The value below is the server's dev-only bootstrap secret,
# for local development only.
PROVISIONING_SECRET=dev-bootstrap-secret-CHANGE-ME

# Election officer key, enabling the on-terminal officer
# panel (Ctrl+Shift+O) for opening and closing polling.
# Leave blank on public-facing terminals so the panel is
# unavailable there.
ADMIN_KEY=

# ---- TLS -------------------------------------------------
# Point this at a truststore containing the server certificate.
# Export it once from the server keystore:
#   keytool -exportcert -alias evoting -keystore evoting-dev.p12 \
#           -storetype PKCS12 -file evoting.crt
#   keytool -importcert -alias evoting -file evoting.crt \
#           -keystore evoting-truststore.p12 -storetype PKCS12
TRUSTSTORE_PATH=
TRUSTSTORE_PASSWORD=

# Accepts any server certificate. This removes the terminal's
# ability to tell the real server from an impostor, so use it
# only on an isolated bench, never in a polling booth.
TRUST_ANY_CERTIFICATE=false

# Permits a plain-HTTP SERVER_URL. Ballots would travel
# unencrypted. Matches the dev server having SSL disabled.
# Set back to false for anything beyond local development.
ALLOW_INSECURE_TRANSPORT=true

# ---- Behaviour -------------------------------------------
# Idle timeout before an unfinished session is abandoned.
SESSION_TIMEOUT_SECONDS=120

# How often the terminal retries delivering held votes.
QUEUE_RETRY_SECONDS=15

# Where held votes and local state are kept. Must survive a
# reboot, so not a temporary directory.
DATA_DIR=evoting-data

# Full-screen, undecorated window for the assembled enclosure.
KIOSK_FULLSCREEN=false
