<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>E-Voting Server</title>
  <meta http-equiv="refresh" content="0; url=/Login.html">
  <style>
    :root {
      --saffron: #FF9933; --green: #0F7A1E; --navy: #0B1F4B;
      --canvas: #F3F1EA; --ink: #17181D; --ink-muted: #5B5F6B; --hairline: #E3DFD2;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0; font-family: "Nirmala UI", "Segoe UI", "Noto Sans", system-ui, sans-serif;
      background: var(--canvas); color: var(--ink); min-height: 100vh;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      padding: 24px;
    }
    .tricolour {
      position: fixed; top: 0; left: 0; right: 0; height: 5px;
      background: linear-gradient(to right, var(--saffron) 0 33.33%, #fff 33.33% 66.66%, var(--green) 66.66% 100%);
    }
    main {
      max-width: 480px; width: 100%; padding: 34px 36px;
      background: #fff; border: 1px solid var(--hairline); border-radius: 16px;
      box-shadow: 0 1px 2px rgba(11,31,75,.06), 0 8px 24px -8px rgba(11,31,75,.16);
      text-align: center;
    }
    .emblem { width: 48px; height: 48px; margin: 0 auto 18px; }
    h1 { font-size: 19px; color: var(--navy); margin: 0 0 12px; font-weight: 700; }
    p { line-height: 1.6; color: var(--ink-muted); font-size: 14.5px; margin: 0 0 10px; }
    a { color: var(--navy); font-weight: 700; text-decoration: none; }
    a:hover { text-decoration: underline; }
  </style>
</head>
<body>
<div class="tricolour"></div>
<main>
  <svg class="emblem" viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
    <circle cx="50" cy="50" r="44" stroke="#0B1F4B" stroke-width="4"/>
    <circle cx="50" cy="50" r="6" fill="#0B1F4B"/>
    <g stroke="#0B1F4B" stroke-width="3" stroke-linecap="round">
      <line x1="50" y1="9" x2="50" y2="24"/>
      <line x1="50" y1="76" x2="50" y2="91"/>
      <line x1="9" y1="50" x2="24" y2="50"/>
      <line x1="76" y1="50" x2="91" y2="50"/>
      <line x1="19.6" y1="19.6" x2="29.9" y2="29.9"/>
      <line x1="70.1" y1="70.1" x2="80.4" y2="80.4"/>
      <line x1="80.4" y1="19.6" x2="70.1" y2="29.9"/>
      <line x1="29.9" y1="70.1" x2="19.6" y2="80.4"/>
      <line x1="33.6" y1="12.4" x2="38.9" y2="26.4"/>
      <line x1="61.1" y1="73.6" x2="66.4" y2="87.6"/>
      <line x1="12.4" y1="66.4" x2="26.4" y2="61.1"/>
      <line x1="73.6" y1="38.9" x2="87.6" y2="33.6"/>
      <line x1="12.4" y1="33.6" x2="26.4" y2="38.9"/>
      <line x1="73.6" y1="61.1" x2="87.6" y2="66.4"/>
      <line x1="33.6" y1="87.6" x2="38.9" y2="73.6"/>
      <line x1="61.1" y1="26.4" x2="66.4" y2="12.4"/>
      <line x1="19.6" y1="80.4" x2="24.7" y2="75.3"/>
      <line x1="75.3" y1="24.7" x2="80.4" y2="19.6"/>
      <line x1="24.7" y1="24.7" x2="19.6" y2="19.6"/>
      <line x1="80.4" y1="80.4" x2="75.3" y2="75.3"/>
    </g>
  </svg>
  <h1>E-Voting Server</h1>
  <p>
    This server has no public voting page. Votes are cast only at a registered
    polling terminal, over an authenticated encrypted connection.
  </p>
  <p>Redirecting to the <a href="/Login.html">administration sign-in</a>.</p>
</main>
</body>
</html>
