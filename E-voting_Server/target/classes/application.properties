spring.application.name=evoting-backend

# ── Database ──────────────────────────────────────────────
# Credentials come from the environment. Nothing secret belongs in this file:
# it is in version control, and a leaked repository must not be a leaked database.
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/votingdb}
spring.datasource.username=postgres
spring.datasource.password=Bala@sql

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.open-in-view=false
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.connection-timeout=20000

# Flyway builds the schema from V1 and applies every later migration in order.
# Do not enable baselining: V1 contains the full initial schema and seed data.
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=false
spring.flyway.validate-on-migrate=true
spring.flyway.locations=classpath:db/migration

# ── Server ────────────────────────────────────────────────
# HTTPS is the default because voting terminals refuse to send ballots over plain HTTP.
# Generate a development keystore with:
#   keytool -genkeypair -alias evoting -keyalg RSA -keysize 2048 -validity 730 \
#           -storetype PKCS12 -keystore evoting-dev.p12 -dname "CN=evoting-server" \
#           -ext "SAN=dns:localhost,ip:127.0.0.1"
server.port=${SERVER_PORT:8443}
server.ssl.enabled=${SERVER_SSL_ENABLED:true}
server.ssl.key-store=${SERVER_SSL_KEYSTORE:file:./evoting-dev.p12}
server.ssl.key-store-type=PKCS12
server.ssl.key-store-password=${SERVER_SSL_KEYSTORE_PASSWORD:}
server.ssl.key-alias=${SERVER_SSL_KEY_ALIAS:evoting}

# ── Machine and administrator security ────────────────────
# All four values must be supplied by the environment.
#   master-key / jwt-secret     base64, exactly 32 bytes each
#   fingerprint-pepper          any high-entropy string; changing it invalidates
#                               every existing fingerprint enrollment
evoting.security.master-key=${EVOTING_MASTER_KEY:}
evoting.security.jwt-secret=${EVOTING_JWT_SECRET:}
evoting.security.fingerprint-pepper=${EVOTING_FINGERPRINT_PEPPER:}
evoting.security.machine-bootstrap-secret=${EVOTING_MACHINE_BOOTSTRAP_SECRET:}

evoting.security.token-ttl=18h
evoting.security.signature-tolerance=120s
evoting.security.biometric-token-ttl=180s
evoting.security.voting-session-ttl=120s
evoting.security.require-signature=true
evoting.security.require-tls=true

# Simulated NFC and fingerprint hardware. Voters without a real enrolled template are
# auto-enrolled with a deterministic simulated one, so the genuine verification path
# still runs. Set to false once the RC522 reader and MFS100 scanner are connected.
evoting.security.simulation-enabled=${EVOTING_SIMULATION_ENABLED:true}

# Second factor for election-officer actions performed at a terminal.
evoting.admin-key=${EVOTING_ADMIN_API_KEY:}
evoting.admin.username=${EVOTING_ADMIN_USERNAME:admin}
evoting.admin.password=${EVOTING_ADMIN_PASSWORD:}

# Administrator session cookies must never travel over plain HTTP.
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.secure=${SESSION_COOKIE_SECURE:true}
server.servlet.session.cookie.same-site=strict

# ── Logging ───────────────────────────────────────────────
logging.level.Backend=INFO
