# ============================================================================
# Local development only. Activated by the "dev" Spring profile (see the
# IntelliJ run configuration shipped in .idea/runConfigurations, or pass
# -Dspring-boot.run.profiles=dev / SPRING_PROFILES_ACTIVE=dev by hand).
#
# Everything here trades a real deployment's guarantees for a one-click local
# run: no TLS, fixed dev keys, a fixed admin password, a fixed terminal
# bootstrap secret. None of this weakens application.properties itself —
# outside this profile every one of these still has to be supplied for the
# server to start at all, exactly as MasterKeyProvider documents.
# ============================================================================

# Only line likely to need editing: your local Postgres password, if it isn't
# the default below.
#
# Don't actually edit it, though — this file is tracked in git, so a real
# password typed in here is one `git add .` away from being in history
# forever. Instead, put it in an untracked "local" profile that layers on
# top of this one:
#
#   1. Create src/main/resources/application-local.properties (never
#      committed — .gitignore refuses to track application-local*.properties
#      specifically so this is safe):
#        spring.datasource.password=your-real-local-password
#   2. Activate both profiles together: -Dspring-boot.run.profiles=dev,local
#      (or SPRING_PROFILES_ACTIVE=dev,local). Spring Boot loads
#      application-local.properties automatically once "local" is active,
#      and later-listed profiles override earlier ones — so this beats the
#      "postgres" default below without touching this file at all.
#
# Setting a DB_PASSWORD environment variable on the run configuration works
# just as well and needs no extra file.
spring.datasource.password= Bala@sql

server.ssl.enabled=false
server.servlet.session.cookie.secure=false
evoting.security.require-tls=false

# Fixed, not ephemeral: MasterKeyProvider's random-per-restart fallback (the
# "deriving an ephemeral development key" log line) sounds convenient but isn't —
# every terminal provisioned under one run's random key fails to decrypt on the
# next restart with an AEADBadTagException, forever, since it's no longer PENDING
# and won't get auto-provisioned again. These are fixed, known, dev-only values —
# fine for a throwaway local database, never for anything real.
evoting.security.master-key=${EVOTING_MASTER_KEY:McUaGhGJ/pOnSHW/w1xoAA4W6g5tBa5G3E66dNaXWVI=}
evoting.security.jwt-secret=${EVOTING_JWT_SECRET:Uw0jDi5Ac1h03WU20DQLAwS6hApOBNpnRrEWX4hPrwE=}

evoting.admin.username=${EVOTING_ADMIN_USERNAME:admin}
evoting.admin.password=${EVOTING_ADMIN_PASSWORD:admin123}

# Matches E-voting_Machine/src/main/resources/config.properties' default
# PROVISIONING_SECRET, so the seeded PI-WARD-01 terminal (see
# V6__dev_test_terminal.sql) self-provisions on server startup with no
# dashboard step required.
evoting.security.machine-bootstrap-secret=${EVOTING_MACHINE_BOOTSTRAP_SECRET:dev-bootstrap-secret-CHANGE-ME}
evoting.security.fingerprint-pepper=${EVOTING_FINGERPRINT_PEPPER:dev-pepper-not-for-production}

# This database is throwaway local test data under active iteration. A migration file
# occasionally gets corrected during development (see V1's history), and re-checksumming
# an already-applied migration is a normal part of that — not the "something unexpected
# changed in a real deployment" signal checksum validation exists to catch. Off here only;
# application.properties has no such override, so a real deployment still gets the real
# safety check.
spring.flyway.validate-on-migrate=false

logging.level.Backend=INFO
