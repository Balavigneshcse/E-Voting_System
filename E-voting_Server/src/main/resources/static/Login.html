<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Login — E-Voting</title>
    <style>
        *,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
        :root{--blue:#0B1F4B;--blue-lt:#15316f;--orange:#FF9933;--orange-dark:#9C4600;--red:#b91c1c;--green:#0F7A1E;--gray:#F3F1EA;--text:#17181D;--muted:#5B5F6B;--border:#E3DFD2;--white:#ffffff;}
        body{font-family:"Nirmala UI",'Segoe UI',system-ui,sans-serif;background:linear-gradient(180deg,#fff7ed 0%,var(--gray) 32%,#f0fdf4 100%);min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px;}

        .header{text-align:center;margin-bottom:28px;}
        .header::before{content:'';display:block;width:118px;height:5px;margin:0 auto 14px;border-radius:99px;background:linear-gradient(90deg,var(--orange) 0 33%,#fff 33% 66%,var(--green) 66%);box-shadow:0 0 0 1px #e5e7eb;}
        .emblem{width:68px;height:68px;background:linear-gradient(180deg,var(--blue) 0%,#06122A 100%);border-radius:50%;margin:0 auto 14px;display:flex;align-items:center;justify-content:center;box-shadow:0 6px 18px -4px rgba(11,31,75,.45);}
        .emblem svg{width:40px;height:40px;}
        .header h1{font-size:22px;font-weight:700;color:var(--blue);}
        .header p{font-size:13px;color:var(--muted);margin-top:3px;}

        .card{background:var(--white);border-radius:16px;padding:36px;width:100%;max-width:400px;border:1px solid var(--border);box-shadow:0 1px 2px rgba(11,31,75,.06),0 20px 48px -12px rgba(11,31,75,.18);}
        .card h2{font-size:18px;font-weight:700;color:var(--text);margin-bottom:4px;}
        .card .sub{font-size:13px;color:var(--muted);margin-bottom:24px;}

        .field{margin-bottom:16px;}
        .field label{display:block;font-size:12.5px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.4px;margin-bottom:6px;}
        .field input{width:100%;padding:11px 13px;border:1.5px solid var(--border);border-radius:10px;font-size:15px;color:var(--text);transition:border-color .2s;}
        .field input:focus{outline:none;border-color:var(--blue);}

        .btn{width:100%;padding:13px;background:linear-gradient(180deg,var(--blue) 0%,#081733 100%);color:var(--white);border:none;border-radius:99px;font-size:15px;font-weight:700;cursor:pointer;margin-top:6px;box-shadow:0 1px 2px rgba(11,31,75,.25);transition:filter .2s,transform .1s;}
        .btn:hover{filter:brightness(1.12);}
        .btn:active{transform:translateY(1px);}

        .alert{padding:11px 13px;border-radius:10px;font-size:13px;margin-bottom:18px;}
        .alert.error  {background:#fef2f2;color:var(--red);  border:1px solid #fecaca;}
        .alert.success{background:#f0fdf4;color:var(--green);border:1px solid #bbf7d0;}

        .back{margin-top:16px;text-align:center;font-size:13px;color:var(--muted);}
        .back a{color:var(--blue);text-decoration:none;}

        .lock-icon{text-align:center;margin-bottom:20px;}

        /* Hide the default browser password reveal button */
        input[type=password]::-ms-reveal{display:none;}
    </style>
</head>
<body>

<div class="header">
    <div class="emblem">
        <svg viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
            <circle cx="50" cy="50" r="44" stroke="#fff" stroke-width="4"/>
            <circle cx="50" cy="50" r="6" fill="#fff"/>
            <g stroke="#fff" stroke-width="3" stroke-linecap="round">
                <line x1="50" y1="9" x2="50" y2="24"/>
                <line x1="50" y1="76" x2="50" y2="91"/>
                <line x1="9" y1="50" x2="24" y2="50"/>
                <line x1="76" y1="50" x2="91" y2="50"/>
                <line x1="19.6" y1="19.6" x2="29.9" y2="29.9"/>
                <line x1="70.1" y1="70.1" x2="80.4" y2="80.4"/>
                <line x1="80.4" y1="19.6" x2="70.1" y2="29.9"/>
                <line x1="29.9" y1="70.1" x2="19.6" y2="80.4"/>
                <line x1="33.6" y1="12.4" x2="38.9" y2="26.4"/>
                <line x1="61.1" y1="73.6" x2="66.4" y2="87.6"/>
                <line x1="12.4" y1="66.4" x2="26.4" y2="61.1"/>
                <line x1="73.6" y1="38.9" x2="87.6" y2="33.6"/>
                <line x1="12.4" y1="33.6" x2="26.4" y2="38.9"/>
                <line x1="73.6" y1="61.1" x2="87.6" y2="66.4"/>
                <line x1="33.6" y1="87.6" x2="38.9" y2="73.6"/>
                <line x1="61.1" y1="26.4" x2="66.4" y2="12.4"/>
                <line x1="19.6" y1="80.4" x2="24.7" y2="75.3"/>
                <line x1="75.3" y1="24.7" x2="80.4" y2="19.6"/>
                <line x1="24.7" y1="24.7" x2="19.6" y2="19.6"/>
                <line x1="80.4" y1="80.4" x2="75.3" y2="75.3"/>
            </g>
        </svg>
    </div>
    <h1>Secure E-Voting System</h1>
    <p>State Election Commission — Administration</p>
</div>

<div class="card">

    <div class="lock-icon">
        <svg width="40" height="40" viewBox="0 0 40 40" fill="none">
            <rect x="8" y="18" width="24" height="18" rx="4" fill="#e6f1fb" stroke="#0B1F4B" stroke-width="1.5"/>
            <path d="M13 18v-5a7 7 0 0114 0v5" stroke="#0B1F4B" stroke-width="1.5" stroke-linecap="round" fill="none"/>
            <circle cx="20" cy="27" r="2.5" fill="#0B1F4B"/>
            <line x1="20" y1="29.5" x2="20" y2="33" stroke="#0B1F4B" stroke-width="1.5" stroke-linecap="round"/>
        </svg>
    </div>

    <h2>Admin Login</h2>
    <p class="sub">Restricted access. Authorised personnel only.</p>

    <!-- Error / success messages from Spring Security redirect -->
    <div id="errorAlert"   style="display:none" class="alert error">Incorrect username or password.</div>
    <div id="logoutAlert"  style="display:none" class="alert success">You have been logged out successfully.</div>

    <!-- Spring Security processes POST /perform-login -->
    <form action="/perform-login" method="POST">

        <div class="field">
            <label for="username">Username</label>
            <input type="text" id="username" name="username" placeholder="admin" autocomplete="off" required>
        </div>

        <div class="field">
            <label for="password">Password</label>
            <input type="password" id="password" name="password" placeholder="Enter password" required>
        </div>

        <button type="submit" class="btn">Login to Admin Panel</button>
    </form>
</div>

<div class="back">State Election Commission — internal use only</div>

<script>
    const params = new URLSearchParams(window.location.search);
    if (params.get('error'))  document.getElementById('errorAlert').style.display  = 'block';
    if (params.get('logout')) document.getElementById('logoutAlert').style.display = 'block';
</script>
</body>
</html>
